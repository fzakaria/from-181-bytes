# Formatting first, then `nix flake check`, which runs everything the
# flake defines, all of it offline:
#
#   checks.tests     the node suite: the hex0 assembler against every
#                    seed, the derivation graph analysis, and the
#                    committed data's invariants
#   checks.site      the deployable tree assembles
#   checks.data-pin  site/data describes the nixpkgs flake.lock pins
#
# The data itself is not regenerated here; docs/data.md says why.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L
